name: Reproduce research artifact
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reproduce-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify publication inputs and mock-only traces
        run: python scripts/verify_publication.py
      - name: Tests, complete experiments, audits and exact CSV comparison
        run: python scripts/reproduce.py
      - name: Preserve reproduction evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p2-reproduction-evidence
          path: |
            artifacts/
            paper/number_audit.json
            paper/manuscript_audit.json
            paper/supplementary_*.zip
          if-no-files-found: warn
          retention-days: 14
